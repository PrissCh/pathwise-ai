(()=>{'use strict';
const KEY='safewalk_connect_v6_shared',CLIENT='safewalk_connect_v6_session';

const EDGES=[['gate','mall',2.3,'mallWest'],['gate','parking',3,'parkingLane'],['gate','plaza',5,'westWalk'],['mall','plaza',2.1,'mallLink'],['mall','bridge',2.1,'northWalk'],['bridge','lift',1.8,'northWalk'],['lift','a',1.7,'elevatorA'],['lift','guard',1.9,'elevatorA'],['plaza','guard',2.3,'centralWalk'],['guard','a',3,'blockAPath'],['guard','b',2.4,'blockBPath'],['plaza','park',2.3,'parkPath'],['park','b',3.3,'gardenWalk'],['park','ramp',1.8,'rampAccess'],['ramp','b',2.4,'rampAccess'],['parking','south',1.4,'southWalk'],['south','park',1.9,'southWalk'],['parking','mall',2.7,'parkingLift'],['bridge','plaza',2.2,'stairsNorth'],['plaza','south',3.1,'southWalk']].map(([a,b,mins,zone],i)=>({id:'e'+i,a,b,mins,zone}));
const ZONES={mallWest:{name:'West retail corridor',light:92,cctv:75,patrol:45},parkingLane:{name:'Parking approach',light:72,cctv:80,patrol:55},westWalk:{name:'Main pedestrian promenade',light:87,cctv:80,patrol:75},mallLink:{name:'Mall entrance corridor',light:92,cctv:90,patrol:65},northWalk:{name:'North walkway',light:90,cctv:80,patrol:55},elevatorA:{name:'Shared elevator connection',light:93,cctv:85,patrol:50},centralWalk:{name:'Central plaza corridor',light:88,cctv:82,patrol:82},blockAPath:{name:'Block A access path',light:86,cctv:84,patrol:80},blockBPath:{name:'Block B access path',light:80,cctv:76,patrol:80},parkPath:{name:'Park-side walkway',light:72,cctv:60,patrol:52},gardenWalk:{name:'Garden connection',light:68,cctv:50,patrol:42},rampAccess:{name:'Step-free access ramp',light:79,cctv:65,patrol:65},southWalk:{name:'South pedestrian route',light:77,cctv:68,patrol:52},parkingLift:{name:'Mall parking lift',light:94,cctv:91,patrol:65},stairsNorth:{name:'North stair connection',light:74,cctv:58,patrol:42}};
const STAGES=['reported','assigned','confirmed'];const LABELS={reported:'Reported',assessed:'Assessed',verified:'Verified',assigned:'Assigned',responding:'In Progress',resolved:'Awaiting verification',confirmed:'Resolved',dismissed:'Not substantiated'};

const byId=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp=()=>new Date().toISOString();const displayDate=s=>new Date(s).toLocaleString(({en:'en-GB',zh:'zh-CN',ms:'ms-MY'})[swLanguage]||'en-GB',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function fresh(){return {version:5,sequence:1000,incidents:[],events:[{id:'EV-0',at:stamp(),actor:'System',message:'Demo dataset initialized. All infrastructure and people are fictional.'}],zones:{},journeys:[],settings:{night:false},assets:{},lastUpdated:stamp()}}
function load(){try{let a=JSON.parse(localStorage.getItem(KEY));if(a?.version===5&&Array.isArray(a.incidents)&&a.zones)return a}catch(e){}return fresh()}
let db=load(),role='resident',page='overview',origin='gate',destination='a',mode='safer',currentRoute='',drawer=false,filter='all',showDemo=true,toastTimeout;
try{let s=JSON.parse(sessionStorage.getItem(CLIENT));if(ROLELABEL[s?.role])role=s.role;if(NODES[s?.origin])origin=s.origin;if(NODES[s?.destination])destination=s.destination;if(['safer','fastest','accessible'].includes(s?.mode))mode=s.mode}catch(e){}

function save(){db.lastUpdated=stamp();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){notice('Local storage is unavailable; changes remain in this tab only.')}saveSession()}
function audit(actor,message){db.events.unshift({id:'EV-'+(++db.sequence),at:stamp(),actor,message});db.events=db.events.slice(0,150)};
const currentActive=()=>db.incidents.filter(i=>!['confirmed','dismissed'].includes(i.status));
function stateZone(z){const active=currentActive().filter(i=>i.zone===z&&i.status!=='reported'&&i.status!=='assessed');const waiting=currentActive().filter(i=>i.zone===z&&['reported','assessed'].includes(i.status));const types=new Set(active.map(i=>i.type));const lightsOff=db.assets?.[z+':lighting']===false;const accessOff=db.assets?.[z+':access']===false;return {closed:accessOff||types.has('closure')||types.has('elevator'),lighting:lightsOff||types.has('lighting'),security:types.has('security'),lightsOff,accessOff,waiting:waiting.length,active:active.length,repairing:active.some(i=>['assigned','responding','resolved'].includes(i.status))}}
function edgeData(e){const z=ZONES[e.zone],s=stateZone(e.zone);let risk=100-(z.light*.36+z.cctv*.26+z.patrol*.22+60*.16); if(db.settings.night)risk+=12;if(s.lighting)risk+=31;if(s.security)risk+=25;return {...e,blocked:s.closed,risk:Math.min(100,Math.max(0,Math.round(risk))),accessible:!['stairsNorth','elevatorA'].includes(e.zone)&&!(e.zone==='parkingLift'&&stateZone('parkingLift').closed),s};}
function solve(kind=mode,from=origin,to=destination){let origin=from,destination=to;if(origin===destination)return null;const edges=EDGES.map(edgeData);let dist={[origin]:0},prev={},unvisited=new Set(Object.keys(NODES));while(unvisited.size){let u=[...unvisited].sort((a,b)=>(dist[a]??Infinity)-(dist[b]??Infinity))[0];if(u===undefined||!Number.isFinite(dist[u]??Infinity))break;unvisited.delete(u);if(u===destination)break;for(let e of edges){if(e.blocked||(kind==='accessible'&&!e.accessible))continue;let v=e.a===u?e.b:e.b===u?e.a:null;if(!v||!unvisited.has(v))continue;let w=kind==='fastest'?e.mins:kind==='safer'?e.mins+e.risk*.075:e.mins+e.risk*.042;let d=dist[u]+w;if(d<(dist[v]??Infinity)){dist[v]=d;prev[v]={node:u,edge:e}}}}
if(!prev[destination])return null;let nodes=[destination],used=[],n=destination;while(n!==origin){let p=prev[n];if(!p)return null;used.unshift(p.edge);nodes.unshift(p.node);n=p.node}let mins=used.reduce((a,e)=>a+e.mins,0),risk=Math.round(used.reduce((a,e)=>a+e.risk*e.mins,0)/mins);return {kind,nodes,edges:used,mins:Math.round(mins*10)/10,meters:Math.round(mins*75),risk,lit:used.filter(e=>e.s.lighting).map(e=>ZONES[e.zone].name),warnings:used.filter(e=>e.s.waiting).map(e=>ZONES[e.zone].name),zones:used.map(e=>e.zone)};}
function choice(){return solve(currentRoute||mode)||solve(mode)}
function recompute(){const r=choice();db.journeys.forEach(j=>{if(j.status!=='active')return;const res=solve(j.mode,j.origin,j.destination);let key=res?.zones.join('|')||'unavailable';if(key!==j.routeKey){j.routeKey=key;j.routeUpdate=stamp();j.warnings.push({at:stamp(),text:res?'Route recalculated following a verified site condition.':'No suitable demo route currently available; seek on-site assistance.'});audit('Routing engine','Active journey '+j.id+': '+(res?'route changed':'no route available'))}});save()}
function notice(msg){let el=byId('toast-root');if(!el)return;el.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.innerHTML='',3700)}

function createIncident({type,zone,description,actor=ROLELABEL[role],priority='medium',demo=false}){if(!ZONES[zone])return;let inc={id:'INC-'+(++db.sequence),type,zone,description:String(description||'').slice(0,400),actor,priority,status:'reported',verified:false,created:stamp(),assignedTo:'',resolution:'',demo,history:[{at:stamp(),by:actor,event:'Report submitted — unverified'}]};db.incidents.unshift(inc);audit(actor,inc.id+' reported: '+type+' at '+ZONES[zone].name);save();render();notice(inc.id+' created; awaiting assessment');return inc}
function legacyTransition(id,next,details=''){let i=db.incidents.find(x=>x.id===id);if(!i)return;const allowed={reported:['assessed','dismissed'],assessed:['verified','dismissed'],verified:['assigned'],assigned:['responding'],responding:['resolved'],resolved:['confirmed']};if(!(allowed[i.status]||[]).includes(next))return notice('Complete the preceding workflow stage first.');const staff=role==='security'||role==='management';if(!staff)return notice('Staff role required for this workflow step.');if(['assessed','verified','dismissed'].includes(next)&&!staff)return;if(['assigned','responding','resolved'].includes(next)&&role!=='management')return notice('Property Management must assign and manage repair.');if(next==='confirmed'&&role!=='management')return notice('Management confirmation required.');i.status=next;if(next==='verified')i.verified=true;if(next==='assigned')i.assignedTo='Facilities response team (demo)';if(next==='resolved')i.resolution='Repair / mitigation marked complete; awaiting independent confirmation';if(next==='confirmed')i.verified=false;i.history.push({at:stamp(),by:ROLELABEL[role],event:LABELS[next]+(details?' — '+details:'')});audit(ROLELABEL[role],i.id+' '+LABELS[next]);recompute();render();notice(i.id+' → '+LABELS[next])}

e switch is for demonstration, not secure authentication.</p></main></div><nav class="mobile-dock" aria-label="Mobile navigation">${navItems().slice(0,5).map(([v,label])=>`<button class="${page===v?'active':''}" data-action="nav" data-view="${v}"><span style="font-size:20px">${({overview:'⌂',routes:'➤',journey:'◉',report:'✎',incidents:'⚑',assets:'▦',insights:'▤',contacts:'☎',settings:'⚙'})[v]}</span>${esc(label.split(' ')[0])}</button>`).join('')}</nav></div>`}
function hero(title,subtitle){return `<div class="hero5"><div><div class="eyebrow">AI-POWERED SMART PROPERTY SAFETY ECOSYSTEM · 6.0</div><h1>${title}</h1><p>${subtitle}</p></div><div class="metrics"><span>🏢 2 Condo Blocks</span><span>🛍️ 1 Shopping Mall</span><span>🌳 Connected Public Realm</span></div></div>`}

function mapSvg(){let chosen=choice();let used=new Set(chosen?.edges.map(e=>e.id)||[]);const bg=`<rect width="900" height="580" fill="${db.settings.night?'#244351':'#ecf4ed'}"/><path d="M0 280 H900 M350 0 V580 M645 0 V580" stroke="${db.settings.night?'#49636b':'#d9e5d9'}" stroke-width="35"/><rect x="120" y="75" width="205" height="136" rx="18" fill="#d8e4da" stroke="#aac7b4"/><rect x="177" y="354" width="150" height="125" rx="16" fill="#cfded3" stroke="#a2bea9"/><rect x="643" y="49" width="184" height="146" rx="17" fill="#d7e6de" stroke="#a9c4b3"/><rect x="650" y="351" width="184" height="143" rx="17" fill="#d6e6dd" stroke="#aec6b6"/><ellipse cx="454" cy="454" rx="88" ry="59" fill="#bfe5c9" stroke="#8ec8a3"/><circle cx="442" cy="444" r="16" fill="#91cba7"/><circle cx="480" cy="470" r="20" fill="#91cba7"/>`;
let all=EDGES.map(edgeData).map(e=>{let a=NODES[e.a],b=NODES[e.b],color=e.blocked?'#cf5d60':e.s.lighting?'#e4a648':e.risk>32?'#9aaea7':'#80b89e';return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#fff" stroke-width="16" stroke-linecap="round"/><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${e.blocked?'8 9':'none'}"/><line data-zone="${e.zone}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="23"><title>${esc(ZONES[e.zone].name)} · risk ${e.risk}/100 ${e.blocked?'· CLOSED':''}</title></line>`}).join('');
let path=chosen?`<polyline points="${chosen.nodes.map(n=>NODES[n].x+','+NODES[n].y).join(' ')}" fill="none" stroke="#f8fff8" stroke-width="17" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${chosen.nodes.map(n=>NODES[n].x+','+NODES[n].y).join(' ')}" fill="none" stroke="#0d906e" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>`:'';
const labels={gate:[4,-22],mall:[-42,-22],parking:[-53,28],plaza:[-53,-29],park:[-42,46],a:[-60,-30],b:[-60,36],guard:[-55,-28],lift:[-45,-30],ramp:[-50,34],bridge:[-51,-29],south:[-52,30]};let pins=Object.entries(NODES).map(([id,n])=>{let l=labels[id],active=id===origin||id===destination,fill=id===origin?'#2078dc':id===destination?'#0c8e67':'#ffffff';return `<g class="map-node5" data-node="${id}" role="button" tabindex="0" aria-label="Select ${esc(n.name)}" transform="translate(${n.x} ${n.y})"><circle r="${active?12:8}" fill="${fill}" stroke="${active?'white':'#598474'}" stroke-width="3"/><text x="${l[0]}" y="${l[1]}" class="map-label5 ${id==='bridge'||id==='south'?'small':''}">${esc(n.name)}</text><title>Click to set destination: ${esc(n.name)}</title></g>`}).join('');return `<div class="map5 ${db.settings.night?'night':''}"><svg viewBox="0 0 900 580" role="img" aria-label="Fictional mixed-use property graph with selectable destinations, live closures and highlighted calculated route">${bg}${all}${path}${pins}</svg></div><div class="map-legend5"><span><i style="background:#0d906e"></i>Selected route</span><span><i style="background:#cf5d60"></i>Verified closure</span><span><i style="background:#e4a648"></i>Lighting fault</span><span><i style="background:#80b89e"></i>Open walkway</span><span>Blue dot = origin</span></div><p class="maphelp5">Tap a named map point to change the destination. Paths are a synthetic graph, not surveyed real-world geometry.</p>`}
function routeOptions(){let list=['safer','fastest','accessible'].map(k=>solve(k));return list.map((r,k)=>{let id=['safer','fastest','accessible'][k],label=['Safer route','Fastest route','Step-free accessible route'][k],desc=['Balances estimated walking time and transparent environment penalties','Minimizes walking duration across open links','Excludes stairs and shared elevator in this synthetic demo'][k];return `<div class="route-card ${mode===id?'chosen':''}"><div class="row5"><div><h3>${label}</h3><p>${desc}</p></div><span class="fig">${r?r.mins+' min':'—'}</span></div>${r?`<p>${r.meters} m approx · Environment exposure index ${r.risk}/100 · ${r.edges.length} links</p>`:`<p class="alert5">No compatible route with currently verified closures.</p>`}<div class="actions5">${btn(mode===id?'✓ Selected':'Choose route','route-mode',`data-mode="${id}"`,'btn-'+(mode===id?'secondary':'outline'))}</div></div>`}).join('')}
function routePlanner(full=true){let r=choice();return `<div class="split5"><section class="card card-pad"><div class="flex-between"><div><h2>Interactive connected property map</h2><p class="muted5">Route graph: 12 places · 20 links · recalculated after verification and closure confirmation</p></div><div class="toolbar5">${btn(db.settings.night?'☀ Day view':'☾ Night view','night','','btn-outline')}</div></div><div class="control-grid" style="margin:15px 0"><div class="field"><label for="origin">Start point</label><select id="origin">${namesOptions(origin)}</select></div><div class="field"><label for="destination">Destination</label><select id="destination">${namesOptions(destination)}</select></div></div>${mapSvg()}${r?`<div class="story"><strong>Recommended ${esc(mode)} option: ${r.mins} min · ${r.meters} m estimated</strong><p>Exposure index ${r.risk}/100 (lower is preferable; illustrative weighted rule, not accident probability). ${r.lit.length?'Lighting fault on selected route: '+esc([...new Set(r.lit)].join(', '))+'.':'No verified lighting fault on selected route.'}</p>${r.warnings.length?`<p>⚠ Unverified reports near route: ${esc([...new Set(r.warnings)].join(', '))}. Treat as advisory until checked.</p>`:''}</div>`:`<div class="alert5">No eligible route is available from these points. Choose another destination or contact on-site staff. Do not proceed based only on this demo.</div>`}</section><section class="card card-pad"><h2>Compare route priorities</h2><p class="muted5">Dijkstra shortest path on weighted site edges. Routes are recomputed from shared confirmed incident conditions.</p>${routeOptions()}${role==='resident'||role==='visitor'?`<div class="actions5">${btn('Start demo journey','start-journey','', 'btn-primary')}</div>`:''}<div class="notice5"><strong>Risk transparency:</strong> base illustrative lighting 36%, CCTV 26%, patrol 22%, pedestrian activity 16%. Night +12; confirmed lighting fault +31; verified safety concern +25 (index points, clipped to 0–100). “Safer” never means safe or risk-free. Unknown and stale data are not independently verified.</div></section></div>`}
function reportForm(){return `<form id="reportForm" class="card card-pad"><h2>Submit an issue</h2><p class="muted5">Reports are stored immediately as <b>unverified</b>. Staff assessment is required before closures affect routing.</p><div class="form-grid" style="margin-top:17px"><div class="field"><label for="reportType">Issue type</label><select id="reportType" required><option value="lighting">Lighting fault</option><option value="elevator">Elevator unavailable</option><option value="closure">Walkway obstruction / closure</option><option value="security">Safety concern</option></select></div><div class="field"><label for="reportZone">Location / zone</label><select id="reportZone" required>${zoneOptions()}</select></div><div class="field"><label for="priority">Priority</label><select id="priority"><option value="medium">Standard</option><option value="high">Urgent</option><option value="low">Low</option></select></div><div class="field full"><label for="reportDetails">What happened?</label><textarea id="reportDetails" maxlength="400" placeholder="Describe what you noticed. Please avoid personal or sensitive information." required></textarea></div></div><div class="form-actions"><button type="submit" class="btn btn-primary">Submit unverified report</button></div></form>`}
function incidentFeed(all=false){let list=all?db.incidents:db.incidents.slice(0,4);return list.length?list.map(incidentCard).join(''):`<div class="empty"><div class="emoji">✅</div><h3>No incidents recorded</h3><p>Submit a report or activate a competition demo scenario.</p></div>`}
function baseJourney(){let mine=db.journeys.filter(j=>j.role===role);let j=mine[0];return `<div class="card card-pad"><div class="flex-between"><div><h2>My demo journey</h2><p class="muted5">Property progress is simulated. Optional device GPS is shown separately because this map is fictional. No external contact delivery.</p></div>${btn('Open route planner','nav','data-view="routes"')}</div>${!j?`<div class="empty"><div class="emoji">🚶</div><h3>No journey in progress</h3><p>Choose a route and start a demo journey.</p></div>`:`<div class="story"><div class="flex-between"><strong>${esc(j.id)} · ${esc(j.status)}</strong>${badge(j.status,j.status==='active'?'blue':'')}</div><p>${esc(NODES[j.origin]?.name)} → ${esc(NODES[j.destination]?.name)} · ${esc(j.mode)} preference</p><div class="bar5" style="margin:12px 0"><i style="width:${j.progress}%"></i></div><p>Progress: ${j.progress}% (user-controlled demo) · ${j.warnings.length} route advisories</p>${j.warnings.slice(-3).map(w=>`<div class="event">${esc(w.text)}<small>${displayDate(w.at)}</small></div>`).join('')}<div class="actions5">${j.status==='active'?`${btn('Advance +25%','progress','','btn-primary')}${btn('Request on-site assistance','help','','btn-amber')}${btn('End journey','end-journey','','btn-outline')}`:''}</div></div>`}</div>`}
function operations(){return `<div class="split5"><div class="card card-pad"><div class="flex-between"><h2>Incident response pipeline</h2>${badge(currentActive().length+' open',currentActive().length?'warn':'')}</div><p class="muted5">Facility reports → assigned maintenance → management confirms resolved → route restored</p>${db.incidents.length?incidentFeed():'<div class="empty"><h3>All clear in demo dataset</h3><p>Activate a scenario to follow the full feedback loop.</p></div>'}${btn('Review all incidents','nav','data-view="incidents"','btn-primary')}</div><div class="card card-pad"><h2>Live operational overview</h2>${metric()}<div class="notice5">The route engine responds to <strong>verified</strong> disruptions only. Reported / assessed issues appear as warnings without automatically closing a route. Resolved work remains restricted until property management confirms restoration.</div><h3 style="margin:17px 0 8px">Latest audit events</h3>${db.events.slice(0,6).map(e=>`<div class="event"><b>${esc(e.message)}</b><small>${esc(e.actor)} · ${displayDate(e.at)}</small></div>`).join('')}</div></div>`}
function conditions(){return `<div class="card card-pad"><div class="flex-between"><h2>Connected site zones</h2>${badge(Object.keys(ZONES).length+' route zones')}</div><p class="muted5">Illustrative environmental attributes, verified disruptions and pending reports. No live CCTV or IoT connection.</p><div class="facility-grid" style="margin-top:14px">${Object.entries(ZONES).map(([id,z])=>{let s=stateZone(id);return `<div class="facility"><div class="facility-top"><strong>${esc(z.name)}</strong>${badge(s.closed?'Closed':s.lighting?'Light fault':s.security?'Advisory':s.waiting?'Unverified report':'Open',s.closed?'bad':s.active?'warn':'')}</div><p>Lighting ${z.light}/100 · CCTV ${z.cctv}/100 · Patrol ${z.patrol}/100</p><small class="muted5">${s.active} active verified/assigned issues · ${s.waiting} awaiting verification</small></div>`}).join('')}</div></div>`}
function insights(){let counts={};for(let i of db.incidents)counts[i.type]=(counts[i.type]||0)+1;return `<div class="cols-2"><div class="card card-pad"><h2>Operational insights</h2>${metric()}<div style="margin-top:17px">${['lighting','elevator','closure','security'].map(t=>`<div class="data-row"><strong>${esc(t)}</strong><strong>${counts[t]||0}</strong></div>`).join('')}</div><p class="muted5">Counts are from the browser demo dataset, not real-world service performance.</p></div><div class="card card-pad"><h2>Immutable-style audit history (demo)</h2><p class="muted5">Append-only interface log stored in editable browser localStorage; not tamper resistant.</p>${db.events.map(e=>`<div class="event"><b>${esc(e.message)}</b><small>${esc(e.actor)} · ${displayDate(e.at)}</small></div>`).join('')}</div></div>`}
function residentHome(){return `<div class="split5"><div><div class="card card-pad"><div class="flex-between"><h2>Walk with better information</h2>${badge('Routing rules implemented')}</div><p class="muted5">Compare three routing priorities across the fictional integrated township.</p><div class="actions5">${btn('Plan a safe-aware route','nav','data-view="routes"','btn-primary')}${btn('Report an issue','nav','data-view="report"')}${btn('Check journey','nav','data-view="journey"')}</div></div><div style="margin-top:16px">${routePlannerPreview()}</div></div><div class="card card-pad"><h2>Community safety updates</h2>${metric()}<h3 style="margin-top:18px">Recent site incidents</h3>${incidentFeed()}</div></div>`}
function routePlannerPreview(){let r=choice();return `<div class="card card-pad"><div class="flex-between"><h2>Property connectivity</h2>${btn('Explore map','nav','data-view="routes"')}</div>${mapSvg()}<div class="story"><strong>${r?`${r.mins} min estimated · ${r.risk}/100 exposure index`:'No compatible path'}</strong><p>Route status updates whenever staff verify incidents or reopen affected connections.</p></div></div>`}
function baseViewContent(){let title=role==='resident'?'Resident safety, connected.':role==='visitor'?'A better way through the township.':role==='security'?'See. Verify. Coordinate.':'One property. One response loop.';let blurb=role==='security'?'Security reviews incoming reports and verifies on-site conditions; verified issues immediately influence wayfinding.':role==='management'?'Assign maintenance, confirm repairs, manage facility ON/OFF demo states, and restore safe routes.':'Navigate shared public spaces, retail, parking and residential paths with verified status updates.';let body=hero(title,blurb);if(page==='routes')body+=routePlanner();else if(page==='journey')body+=journey();else if(page==='report')body+=reportForm();else if(page==='incidents')body+=`<div class="card card-pad"><div class="flex-between"><div><h2>Incident workflow and live updates</h2><p class="muted5">Updates share immediately across all role dashboards in this browser.</p></div>${badge(db.incidents.length+' total')}</div>${incidentFeed(true)}</div>`;else if(page==='assets')body+=conditions();else if(page==='insights')body+=insights();else body+=(role==='security'||role==='management'?operations():residentHome());if(role==='management'&&page==='overview')body+=managementFacilityControls();body+=scenarioPanel();return shell(body)}
function render(){byId('app-root').innerHTML=viewContent();saveSession();applyLanguage()}
function startJourney(){const r=choice();if(!r)return notice('No eligible route. Adjust your preferences.');let j={id:'J-'+(++db.sequence),role,origin,destination,mode,routeKey:r.zones.join('|'),created:stamp(),progress:0,status:'active',warnings:[],routeUpdate:null};db.journeys.unshift(j);audit(ROLELABEL[role],'Journey '+j.id+' started (simulated)');save();page='journey';render();notice('Demo journey started')}
function latestJourney(){return db.journeys.find(j=>j.role===role&&j.status==='active')}
function assistance(){let j=latestJourney();if(!j)return notice('Start a journey first.');createIncident({type:'security',zone:choice()?.zones.at(-1)||'centralWalk',description:'On-site assistance requested during '+j.id+'. No real alert is delivered.',actor:ROLELABEL[role],priority:'high'});notice('Assistance request logged in demo. For real danger, use on-site emergency systems.')}
document.addEventListener('click',e=>{let point=e.target.closest('[data-node]');if(point){destination=point.dataset.node;page='routes';render();return}let b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case 'drawer':drawer=!drawer;render();break;case 'nav':if(navItems().some(x=>x[0]===b.dataset.view)){page=b.dataset.view;drawer=false;render()}break;case 'reset':reset();break;case 'simulate':simulate(b.dataset.type);break;case 'route-mode':mode=b.dataset.mode;currentRoute='';render();break;case 'night':db.settings.night=!db.settings.night;save();render();break;case 'advance':transition(b.dataset.id,b.dataset.next);break;case 'start-journey':startJourney();break;case 'progress':{let j=latestJourney();if(!j)return;j.progress=Math.min(100,j.progress+25);if(j.progress===100){j.status='arrived';audit(ROLELABEL[role],j.id+' arrived (simulated)')}save();render();break}case 'end-journey':{let j=latestJourney();if(j){j.status='ended';audit(ROLELABEL[role],j.id+' ended');save();render()}break}case 'help':assistance();break;}});
document.addEventListener('change',e=>{if(e.target.id==='roleSelect')setRole(e.target.value);else if(e.target.id==='origin'||e.target.id==='destination'){if(NODES[e.target.value]){if(e.target.id==='origin')origin=e.target.value;else destination=e.target.value;render()}}});
document.addEventListener('submit',e=>{if(e.target.id!=='reportForm')return;e.preventDefault();let type=byId('reportType').value,zone=byId('reportZone').value,priority=byId('priority').value,description=byId('reportDetails').value.trim();if(description.length<5)return notice('Please enter at least five characters.');createIncident({type,zone,priority,description})});
document.addEventListener('keydown',e=>{let p=e.target.closest('[data-node]');if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();destination=p.dataset.node;page='routes';render()}});
window.addEventListener('storage',e=>{if(e.key!==KEY)return;db=load();render();notice('Shared demo state updated from another tab')});

let gpsWatch=null,gpsFix=null,gpsError='',alarmContext=null,safetyTimer=null,lastMotion=null,checkin=null;
const v6key=KEY+'_extras';
let extras;try{extras=JSON.parse(localStorage.getItem(v6key))}catch(e){}
extras=Object.assign({contacts:[],deliveries:[],availability:{},consent:false,deviation:45,stopSeconds:180,responseSeconds:45,escalate:false},extras||{});
function saveExtras(){try{localStorage.setItem(v6key,JSON.stringify(extras))}catch(e){notice('Contact settings could not be saved.')}}
function navItems(){let n=baseNavItems();if(role==='resident')n.push(['contacts','Emergency contacts']);n.push(['settings','Safety settings']);return n;}
function isFacility(i){return i.type!=='security'}
function transition(id,next){let i=db.incidents.find(x=>x.id===id);if(!i)return;const facility=isFacility(i);const owner=facility?'management':'security';if(role!==owner)return notice('This action requires the responsible dashboard.');
if(next==='assigned'){if(i.status!=='reported')return;i.assignedTo=facility?'Facilities maintenance team (simulation)':'Security Control Room (simulation)';i.verified=true;}
else if(facility&&next==='confirmed'){if(!['assigned','responding','resolved'].includes(i.status))return; if(!confirm('Confirm the repair is completed and the affected route is safe to restore?'))return;i.resolution='Repair completed and restoration confirmed by Management';i.verified=false;}
else if(!facility&&next==='responding'){if(i.status!=='assigned')return;}
else if(!facility&&next==='confirmed'){if(!['responding','assigned'].includes(i.status))return;i.verified=false;}
else return;i.status=next;i.history.push({at:stamp(),by:ROLELABEL[role],event:facility&&next==='confirmed'?'Resolved · management confirmed':LABELS[next]});audit(ROLELABEL[role],i.id+' '+(facility&&next==='confirmed'?'Resolved':LABELS[next]));recompute();render();notice('Demo incident updated');}

let swLanguage=localStorage.getItem(SW_LANG_KEY)||'en';
if(!['en','zh','ms'].includes(swLanguage))swLanguage='en';
function swTranslated(text){if(swLanguage==='en')return text;let trimmed=text.trim();let item=SW_I18N[trimmed];if(item)return item[swLanguage==='zh'?0:1];return text;}
function applyLanguage(){
 document.documentElement.lang=swLanguage==='zh'?'zh-CN':swLanguage==='ms'?'ms':'en';
 const root=document.getElementById('app-root');if(!root)return;
 root.querySelectorAll('.sw-lang-picker').forEach(x=>x.remove());const picker=document.createElement('label');picker.className='sw-lang-picker';picker.setAttribute('aria-label','Language / 语言 / Bahasa');
 picker.innerHTML='<span>🌐</span><select id="sw-language" aria-label="Language / 语言 / Bahasa"><option value="en">English</option><option value="zh">简体中文</option><option value="ms">Bahasa Melayu</option></select>';
 const target=root.querySelector('.top-actions')||root.querySelector('.auth-form-card')||root.querySelector('main')||root.firstElementChild;
 if(target){target.prepend(picker);picker.querySelector('select').value=swLanguage;}
 // English must not contain leftover Chinese interface banners.
 if(swLanguage==='en')return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){if(node.parentElement?.closest('script,style,textarea,option#sw-language'))continue;
 const value=node.nodeValue,trimmed=value.trim();if(!trimmed)continue;
 let translated=swTranslated(trimmed); if(swLanguage!=='en'&&!SW_I18N[trimmed]){let z=trimmed.match(/^(\d+) (total|open)$/);if(z)translated=z[1]+' '+(z[2]==='total'?(swLanguage==='zh'?'总计':'jumlah'):(swLanguage==='zh'?'未结':'terbuka'));} const m=trimmed.match(/^🔔 (\d+) pending (facility requests|security assistance requests)$/);if(m&&swLanguage==='zh')translated='🔔 '+m[1]+' '+(m[2]==='facility requests'?'项待处理设施工单':'项待处理安全求助');else if(m&&swLanguage==='ms')translated='🔔 '+m[1]+' '+(m[2]==='facility requests'?'permintaan fasiliti belum selesai':'permintaan bantuan keselamatan belum selesai');if(translated!==trimmed)node.nodeValue=value.replace(trimmed,translated);
 }
 for(const el of root.querySelectorAll('[placeholder],[title],[aria-label]')){
 for(const attr of ['placeholder','title','aria-label']){if(el.hasAttribute(attr)){const val=el.getAttribute(attr);el.setAttribute(attr,swTranslated(val));}}
 }
}
document.addEventListener('change',e=>{if(e.target?.id==='sw-language'){swLanguage=e.target.value;localStorage.setItem(SW_LANG_KEY,swLanguage);render();}});


// Privacy-first emergency-contact handoff: demo preview and user-initiated share, never automatic delivery.
let swShareText='';
function swShareModal(){
 const existing=document.getElementById('sw-share-modal');if(existing)existing.remove();
 if(!extras.contacts.length){notice(swTranslated('No emergency contacts saved yet. Add a contact before sharing.'));page='contacts';render();return;}
 const gps=(extras.consent&&gpsFix)?gpsFix:null;
 const locationLine=gps?`${Number(gps.latitude).toFixed(6)}, ${Number(gps.longitude).toFixed(6)}`:'No GPS fix; demo property location only';
 const link=gps?`https://www.google.com/maps?q=${encodeURIComponent(gps.latitude+','+gps.longitude)}`:'';
 const opt=extras.contacts.map((c,i)=>`<option value="${i}">${esc(c.name)} (${esc(c.relationship)})</option>`).join('');
 const modal=document.createElement('div');modal.id='sw-share-modal';modal.className='modal-backdrop';
 modal.innerHTML=`<section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${swTranslated('Location sharing preview')}</h2><button class="icon-btn" type="button" data-action="sw-close-share">✕</button></div><div class="modal-body"><div class="field"><label>${swTranslated('Choose a contact')}</label><select id="sw-share-contact">${opt}</select></div><p class="block-note">${swTranslated('Simulation only — not a live tracking link or automatically delivered alert.')}</p><div class="field" style="margin:14px 0"><label>${swTranslated('Emergency location message')}</label><textarea id="sw-share-text" rows="5" readonly></textarea></div><div class="actions5"><button type="button" class="btn btn-primary" data-action="sw-copy-share">${swTranslated('Copy location message')}</button><button type="button" class="btn btn-outline" data-action="sw-whatsapp">${swTranslated('Share via WhatsApp')}</button></div><p class="small muted" style="margin-top:12px">${swTranslated('GPS coordinates (latest fix)')}: ${esc(locationLine)}</p></div></section>`;
 document.body.appendChild(modal);
 const update=()=>{const c=extras.contacts[Number(document.getElementById('sw-share-contact').value)];swShareText=`SOS — PathWise AI (manual sharing / demo)\nI may need help. Please contact me.\nContact: ${c.name}\nLocation: ${locationLine}${link?'\nMap: '+link:''}\nTime: ${new Date().toLocaleString()}\nThis is not a live tracking link.`;swShareText=swSOSMessage();document.getElementById('sw-share-text').value=swShareText;};
 document.getElementById('sw-share-contact').addEventListener('change',update);update();
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;
 if(a==='share-emergency-location')swShareModal();if(a==='sos'&&extras.contacts.length){setTimeout(()=>{if(!document.getElementById('sw-share-modal'))swShareModal();},80);}
 if(a==='sw-close-share')document.getElementById('sw-share-modal')?.remove();
 if(a==='sw-copy-share'){const ta=document.getElementById('sw-share-text');ta?.select();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(swShareText).then(()=>notice(swTranslated('Location message copied. Paste it into your messaging app to send.'))).catch(()=>notice('Select and copy the message manually.'));else notice('Select and copy the message manually.');}
 if(a==='sw-whatsapp'){const c=extras.contacts[Number(document.getElementById('sw-share-contact')?.value||0)];const digits=(c?.phone||'').replace(/\D/g,'');const url=digits.length>=8?`https://wa.me/${digits}?text=${encodeURIComponent(swShareText)}`:`https://api.whatsapp.com/send?text=${encodeURIComponent(swShareText)}`;window.open(url,'_blank','noopener,noreferrer');}
});

function swSOSMessage(){
 let position=(extras.consent&&gpsFix)?gpsFix:null;
 let coord=position?Number(position.latitude).toFixed(6)+','+Number(position.longitude).toFixed(6):null;
 let map=coord?'https://www.google.com/maps?q='+encodeURIComponent(coord):'';
 let d=new Date().toLocaleString(swLanguage==='zh'?'zh-CN':swLanguage==='ms'?'ms-MY':'en-GB');
 if(swLanguage==='zh')return '🆘 PathWise AI 紧急求助！我可能遇到危险，请立即联系我或拨打紧急电话。'+(coord?'\n我的最近位置：https://www.google.com/maps?q='+encodeURIComponent(coord):'\n当前未获取 GPS 位置，请联系我确认位置。')+'\n时间：'+d+'\n注意：此消息包含的是最近一次位置，不是持续实时追踪。';
 if(swLanguage==='ms')return '🆘 KECEMASAN PathWise AI! Saya mungkin dalam bahaya. Sila hubungi saya segera atau hubungi perkhidmatan kecemasan.'+(coord?'\nLokasi terakhir saya: '+map:'\nLokasi GPS belum tersedia. Sila hubungi saya untuk mengesahkan lokasi.')+'\nMasa: '+d+'\nNota: Ini lokasi terakhir, bukan penjejakan langsung berterusan.';
 return '🆘 PathWise AI EMERGENCY! I may be in danger. Please contact me immediately or call emergency services.'+(coord?'\nMy latest location: '+map:'\nGPS location is currently unavailable. Please contact me to confirm my location.')+'\nTime: '+d+'\nNote: This is a last-known location, not continuous live tracking.';
}

// Stop safety check: foreground device GPS only; demo controls never imply real GPS.
let swStopJourney=null,swStopNotification=null,swStopStatus='Enable GPS during a journey to monitor stops.';
function swResetStop(){lastMotion=null;swStopJourney=null;}
function swObserveStop(fix){
 const j=latestJourney(),now=Date.now();
 if(!signedIn||!j||!extras.consent||document.visibilityState!=='visible'){swResetStop();return;}
 if(!Number.isFinite(fix.latitude)||!Number.isFinite(fix.longitude)||!Number.isFinite(fix.accuracy)||fix.accuracy>100){swResetStop();swStopStatus='GPS accuracy is too low. Stop monitoring is waiting for a better fix.';return;}
 const measured=Date.parse(fix.at);
 if(!Number.isFinite(measured)||Math.abs(now-measured)>15000){swResetStop();return;}
 if(checkin)return;
 if(swStopJourney!==j.id||!lastMotion||now-(lastMotion.lastFix||0)>20000){swStopJourney=j.id;lastMotion={...fix,since:now,lastFix:now};}
 else if(distance(lastMotion,fix)>Math.max(15,lastMotion.accuracy+fix.accuracy)){lastMotion={...fix,since:now,lastFix:now};}
 else lastMotion.lastFix=now;
 swStopStatus='Monitoring your stop using device GPS.';
 swCheckStop();
}
function swCheckStop(){
 if(!lastMotion||checkin)return;
 const j=latestJourney(),now=Date.now();
 if(!signedIn||!j||j.id!==swStopJourney||!extras.consent||document.visibilityState!=='visible'){swResetStop();return;}
 if(now-lastMotion.lastFix>15000){swResetStop();swStopStatus='Waiting for a fresh GPS fix. Stop timing will restart.';return;}
 if(now-lastMotion.since>=Number(extras.stopSeconds)*1000)openCheckin('stop-gps');
}
const swPriorOpenCheckin=openCheckin;
openCheckin=function(kind){
 if(checkin||!latestJourney()||!signedIn)return;
 swPriorOpenCheckin(kind);
 const title=byId('checkTitle');if(title&&kind!=='deviation')title.textContent='You have stopped for a while. Are you safe?';
 if('Notification' in window&&Notification.permission==='granted'){
  try{swStopNotification=new Notification(swTranslated('PathWise AI: Are you safe?'),{body:swTranslated('You have been at the same location for a while. Open PathWise AI to confirm you are safe or request help.'),tag:'safewalk-stop-check',requireInteraction:true});swStopNotification.onclick=()=>{window.focus();byId('v6modal')?.querySelector('button')?.focus();};}catch(e){}
 }
};
const swPriorCloseCheckin=closeCheckin;
closeCheckin=function(){swPriorCloseCheckin();swStopNotification?.close();swStopNotification=null;swResetStop();};
const swPriorStopGPS=stopGPS;
stopGPS=function(){swPriorStopGPS();swResetStop();swStopStatus='GPS is off. Enable GPS to monitor stops.';if(checkin)closeCheckin();};
const swStopJourneyUI=journey;
journey=function(){
 const content=swStopJourneyUI(),j=latestJourney();if(!j)return content;
 const permission='Notification' in window?Notification.permission:'unsupported';
 return '<section class="card card-pad" style="margin-bottom:14px"><h2>Prolonged-stop safety check</h2><p>If you stay near the same point for '+esc(Math.round(extras.stopSeconds/60*10)/10)+' minutes, PathWise AI asks whether you are safe. GPS uncertainty is allowed for.</p><p role="status" style="margin-top:10px"><strong>'+esc(checkin?'Safety confirmation needed.':gpsWatch===null?'Enable foreground GPS to start monitoring.':swStopStatus)+'</strong></p><p>Notification permission: '+esc(permission)+'. Response window: '+esc(extras.responseSeconds)+' seconds. '+'No response creates a high-priority local control-room request.'+'</p><div class="actions5">'+btn('Enable safety notifications','sw-stop-permission','','btn-outline')+btn('Test stop safety check','sw-stop-test','','btn-secondary')+btn('Configure stop duration','sw-stop-settings','','btn-outline')+'</div><p class="muted5">Keep this page open with GPS enabled. Browser notifications require browser permission and support. Closed pages and locked screens can interrupt monitoring. The test opens a simulated check-in immediately.</p></section>'+content;
};
setInterval(swCheckStop,1000);
document.addEventListener('visibilitychange',swResetStop);
document.addEventListener('click',async e=>{
 const action=e.target.closest('[data-action]')?.dataset.action;
 if(action==='sw-stop-test')openCheckin('stop');
 if(action==='sw-stop-settings'){page='settings';render();}
 if(action==='sw-stop-permission'){
  if(!('Notification' in window))return notice('Browser notifications are unavailable. In-app safety prompts still work.');
  try{const result=await Notification.requestPermission();notice(result==='granted'?'Safety notifications enabled.':'Notifications are not enabled. In-app safety prompts still work.');if(page==='journey')render();}catch(e){notice('Notifications are unavailable here. In-app safety prompts still work.');}
 }
 if(action==='check-safe')notice('You confirmed you are safe. The stop timer will restart with the next GPS fix.');
});

function swPhoneParts(phone){const digits=String(phone||'').replace(/\D/g,'');if(String(phone||'').trim().startsWith('+')){const country=swCountries.filter(c=>c[2]).sort((a,b)=>b[2].length-a[2].length).find(c=>digits.startsWith(c[2]));if(country)return {country:country[0],code:country[2],number:digits.slice(country[2].length)};return {country:'OTHER',code:'',number:digits};}return {country:'MY',code:'60',number:digits};}

function swLocationMessage(fix){const coord=Number(fix.latitude).toFixed(6)+','+Number(fix.longitude).toFixed(6),map='https://www.google.com/maps?q='+coord,time=new Date(fix.at).toLocaleString(swLocale());if(swLanguage==='zh')return 'PathWise AI：这是我最近的位置，请联系我确认安全。\n位置：'+map+'\n定位时间：'+time+'\n精确度：约 '+Math.round(fix.accuracy)+' 米。\n这是最近一次定位，并非持续实时追踪。';if(swLanguage==='ms')return 'PathWise AI: Ini lokasi terkini saya. Sila hubungi saya untuk memastikan saya selamat.\nLokasi: '+map+'\nMasa bacaan: '+time+'\nKetepatan: kira-kira '+Math.round(fix.accuracy)+' m.\nIni lokasi terakhir, bukan penjejakan langsung berterusan.';return 'PathWise AI: Here is my latest location. Please contact me to check that I am safe.\nLocation: '+map+'\nLocation time: '+time+'\nAccuracy: approximately '+Math.round(fix.accuracy)+' m.\nThis is a last-known location, not continuous live tracking.';}

swShareModal=function(){if(!extras.contacts.length){page='contacts';render();notice(swTranslated('No emergency contacts saved yet. Add a contact before sharing.'));return;}if(extras.contacts.length===1)return swOpenContactShare(extras.contacts[0].id);const box=document.createElement('div');byId('sw-contact-share-modal')?.remove();box.id='sw-contact-share-modal';box.className='modal-backdrop';box.innerHTML='<section class="modal" role="dialog" aria-modal="true"><div class="modal-body"><h2>Choose a contact</h2>'+extras.contacts.map(c=>'<div class="actions5"><button class="btn btn-outline" data-action="sw-contact-share" data-id="'+esc(c.id)+'"><span data-user-content>'+esc(c.name)+' · '+esc(c.phone)+'</span></button></div>').join('')+'<div class="actions5">'+btn('Close','sw-contact-share-close')+'</div></div></section>';document.body.appendChild(box);applyLanguage();};
document.addEventListener('change',e=>{if(e.target.id==='swContactCountry'){const country=swCountries.find(c=>c[0]===e.target.value);byId('swContactCode').value='+'+country[2];byId('swContactCode').readOnly=country[0]!=='OTHER';if(country[0]==='OTHER')byId('swContactCode').focus();}});
document.addEventListener('submit',e=>{if(e.target.id!=='swContactForm')return;e.preventDefault();const phone=swInternationalPhone(byId('swContactCode').value,byId('swContactPhone').value),name=byId('swContactName').value.trim(),relationship=byId('swContactRelation').value.trim();if(!phone||!name||!relationship){byId('swContactError').textContent=swTranslated('Enter a name, relationship and valid mobile number with country code.');return;}const rank=byId('swContactRank').value,id=swEditingContact||'C-'+Date.now();extras.contacts=extras.contacts.filter(c=>c.id!==id);if(rank!=='Additional')for(const c of extras.contacts)if(c.rank===rank)c.rank='Additional';extras.contacts.push({id,name,relationship,phone,rank});swEditingContact=null;saveExtras();render();notice(swTranslated('Contact saved on this device.'));});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='sw-contact-edit'){swEditingContact=b.dataset.id;page='contacts';render();byId('swContactName')?.focus();byId('swContactForm')?.scrollIntoView({behavior:'smooth',block:'center'});}if(action==='sw-contact-cancel'){swEditingContact=null;render();}if(action==='sw-contact-remove'&&confirm('Remove this emergency contact?')){extras.contacts=extras.contacts.filter(c=>c.id!==b.dataset.id);if(swEditingContact===b.dataset.id)swEditingContact=null;saveExtras();render();}if(action==='sw-contact-share')swOpenContactShare(b.dataset.id);if(action==='sw-contact-share-close')byId('sw-contact-share-modal')?.remove();const ta=byId('swReadyLocation');if(action==='sw-contact-copy'&&ta){try{await navigator.clipboard.writeText(ta.value);notice(swTranslated('Location message copied. Paste it into your messaging app to send.'));}catch(e){ta.focus();ta.select();notice(swTranslated('Select and copy the message manually.'));}}if(action==='sw-contact-native-share'&&ta){if(navigator.share){try{await navigator.share({title:'PathWise AI',text:ta.value});}catch(error){if(error.name!=='AbortError')notice(swTranslated('Sharing is unavailable. Use WhatsApp, SMS or copy the message.'));}}else notice(swTranslated('Sharing is unavailable. Use WhatsApp, SMS or copy the message.'));}});

 let distance=lens.reduce((a,b)=>a+b,0)*Math.max(0,Math.min(100,j.progress))/100,k=0;
 while(k<lens.length-1&&distance>lens[k])distance-=lens[k++];
 const p=pts[k],q=pts[k+1];if(!p||!q)return null;const f=lens[k]?distance/lens[k]:0;
 return {x:p.x+(q.x-p.x)*f,y:p.y+(q.y-p.y)*f,origin:j.origin,destination:j.destination,progress:j.progress,at:stamp(),kind:'simulation'};
}
function swTimeoutAssistance(event){
 if(!signedIn||signedIn.role!=='resident'||signedIn.name!==event.requester)return;
 const j=db.journeys.find(x=>x.id===event.journeyId&&x.status==='active');if(!j)return;
 let i=db.incidents.find(x=>x.type==='security'&&x.requester===event.requester&&!['confirmed','dismissed'].includes(x.status));
 if(!i)i=createIncident({type:'security',zone:solve(j.mode,j.origin,j.destination)?.zones.at(-1)||'centralWalk',description:'Possible emergency — safety check-in unanswered.',actor:ROLELABEL.resident,priority:'high',demo:true});
 if(!i)return;
 const eventId=j.id+':'+event.at;
 if(i.timeoutEvents?.includes(eventId))return;
 i.timeoutEvents=[...(i.timeoutEvents||[]),eventId];i.priority='high';i.requester=event.requester;i.journeyId=j.id;i.trigger='unanswered-checkin';i.possibleEmergency=true;i.propertyLocation=swSnapshot(j);
 i.latestLocation=extras.consent&&gpsFix?{...gpsFix}:null;
 i.history.push({at:stamp(),by:'System',event:'User stopped responding to a safety check-in'});
 audit('System',i.id+' · Automatic timeout escalation');recordDelivery('No response to safety check-in');save();render();notice('Automatic assistance request created. The local demo control room can review your latest available location.');
}
const swTimeoutIncidentCard=incidentCard;
incidentCard=function(i){let result=swTimeoutIncidentCard(i);if(!i.possibleEmergency)return result;
 let extra='<section class="notice5"><strong>Possible emergency / no response</strong><p>This demo updates compatible tabs in the same browser. Cross-device delivery requires a connected backend.</p>';
 if((role==='security'||(role==='officer'&&i.assignedTo===signedIn?.name))&&!['confirmed','dismissed'].includes(i.status)){
 extra+='<h3>Location at escalation</h3>';
 if(i.latestLocation){const p=i.latestLocation;extra+='<p>Last-known device GPS location · '+Number(p.latitude).toFixed(6)+', '+Number(p.longitude).toFixed(6)+' · ±'+Math.round(p.accuracy)+' m · '+displayDate(p.at)+'</p><p>Location may be stale. Review the timestamp and accuracy before responding.</p><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps?q='+Number(p.latitude)+','+Number(p.longitude)+'">Open last-known GPS location</a>';}
 else extra+='<p>No authorized device location is available. Ask the resident to enable GPS or confirm their location.</p>';
 if(i.propertyLocation){const p=i.propertyLocation;extra+='<p><b>Simulated property location — not device GPS</b></p><p>'+esc(NODES[p.origin]?.name)+' → '+esc(NODES[p.destination]?.name)+' · '+p.progress+'% · '+displayDate(p.at)+'</p><svg viewBox="0 0 900 580" role="img" aria-label="Journey location snapshot" style="width:100%;max-height:320px;background:#ecf4ed;border-radius:14px">'+EDGES.map(e=>'<line x1="'+NODES[e.a].x+'" y1="'+NODES[e.a].y+'" x2="'+NODES[e.b].x+'" y2="'+NODES[e.b].y+'" stroke="#83ad98" stroke-width="8"/>').join('')+Object.values(NODES).map(n=>'<circle cx="'+n.x+'" cy="'+n.y+'" r="6" fill="#537365"/><text x="'+(n.x+9)+'" y="'+(n.y-12)+'" font-size="16">'+esc(n.name)+'</text>').join('')+'<circle cx="'+p.x+'" cy="'+p.y+'" r="20" fill="#147bef" opacity=".2"/><circle cx="'+p.x+'" cy="'+p.y+'" r="10" fill="#147bef" stroke="white" stroke-width="3"/></svg>';}
 }
 return result+extra+'</section>';
};


// Control-room alerts are local demo notifications, shared through compatible same-file tabs.
const swSeenControlAlerts=new Set();
let swCurrentControlAlert=null,swControlAlertSignature='';
function swDismissControlAlert(acknowledge=true){
 if(acknowledge&&swCurrentControlAlert)swSeenControlAlerts.add(swCurrentControlAlert);
 byId('sw-control-popup')?.remove();swCurrentControlAlert=null;swControlAlertSignature='';
}
function swCheckControlAlerts(){
 if(!signedIn||signedIn.role!=='security'){swDismissControlAlert(false);return;}
 const pending=db.incidents.filter(i=>i.type==='security'&&i.possibleEmergency&&!['confirmed','dismissed'].includes(i.status)&&!swSeenControlAlerts.has(i.id));
 if(swCurrentControlAlert&&!pending.some(i=>i.id===swCurrentControlAlert))swDismissControlAlert(false);
 const i=pending.find(i=>i.id===swCurrentControlAlert)||pending[0];if(!i)return;
 const signature=JSON.stringify([i.id,i.status,i.latestLocation,i.propertyLocation,swLanguage]);
 if(signature===swControlAlertSignature&&byId('sw-control-popup'))return;
 let box=byId('sw-control-popup'),isNew=!box;
 if(!box){box=document.createElement('div');box.id='sw-control-popup';box.className='modal-backdrop';box.style.zIndex='160';document.body.appendChild(box);}
 swCurrentControlAlert=i.id;swControlAlertSignature=signature;
 box.innerHTML='<section class="modal" role="alertdialog" aria-modal="true" aria-labelledby="swControlTitle"><div class="modal-head" style="background:#fff0ef"><h2 id="swControlTitle">Resident needs assistance</h2></div><div class="modal-body"><strong>High-priority assistance request</strong><p>No reply before the countdown ended. Please review the location and respond.</p><p>Resident: <span data-user-content>'+esc(i.requester||'Resident')+'</span></p>'+incidentCard(i)+'<p>Location is the latest available fix, not guaranteed live.</p><div class="actions5">'+btn('Open assistance request','sw-control-open','','btn-danger')+btn('Acknowledge alert','sw-control-ack','','btn-outline')+'</div></div></section>';
 applyLanguage();if(isNew)box.querySelector('button')?.focus();
}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;
 if(action==='sw-control-ack')swDismissControlAlert(true);
 if(action==='sw-control-open'){const id=swCurrentControlAlert;swDismissControlAlert(true);page='incidents';render();setTimeout(()=>{const cards=[...document.querySelectorAll('.incident')];cards.find(c=>c.textContent.includes(id))?.scrollIntoView({block:'center',behavior:'smooth'});},0);}
 if(action==='logout')swDismissControlAlert(false);
});
window.addEventListener('storage',e=>{if(e.key===KEY)setTimeout(swCheckControlAlerts,0);});
setInterval(swCheckControlAlerts,600);


// Separate control-room dispatch from the assigned officer's response workflow.
const swOfficerRoster=[{name:'Officer Alex',username:'officer'},{name:'Officer Sara',username:'officer2'}];
function swOfficerBusy(name){return db.incidents.some(i=>i.type==='security'&&i.assignedTo===name&&['assigned','responding'].includes(i.status));}
function swVisibleIncidents(){return db.incidents.filter(i=>{
 if(role==='management')return isFacility(i);
 if(role==='security')return !isFacility(i);
 if(role==='officer')return !isFacility(i)&&i.assignedTo===signedIn?.name;
 return i.requester===signedIn?.name||i.actor===ROLELABEL[role];
});}
incidentFeed=function(all=false){const visible=swVisibleIncidents(),list=all?visible:visible.slice(0,4);return list.length?list.map(incidentCard).join(''):'<div class="empty"><h3>'+swTranslated(role==='officer'?'No assignments yet.':'No incidents recorded')+'</h3></div>';};
const swDispatchCard=incidentCard;
incidentCard=function(i){let output=swDispatchCard(i);if(isFacility(i))return output;
 output=output.replace(/<button\b[^>]*data-action="advance"[^>]*>[\s\S]*?<\/button>/g,'');
 if(role==='security'&&i.status==='reported'){
 const options=swOfficerRoster.map(o=>'<option value="'+esc(o.name)+'" '+(swOfficerBusy(o.name)?'disabled':'')+'>'+esc(swTranslated(o.name))+(swOfficerBusy(o.name)?' · '+swTranslated('Busy with an active assignment'):'')+'</option>').join('');
 output+='<section class="card card-pad" style="margin-bottom:18px"><h3>Assign security officer</h3><p>The control room assigns an officer; the assigned officer accepts and resolves the request.</p><div class="field" style="margin-top:10px"><label for="assign-'+i.id+'">Choose a security officer</label><select id="assign-'+i.id+'" data-officer-for="'+i.id+'">'+options+'</select></div><div class="actions5">'+btn('Assign selected officer','sw-dispatch-officer','data-id="'+i.id+'"','btn-primary')+'</div></section>';
 }
 if(role==='officer'&&i.assignedTo===signedIn?.name){if(i.status==='assigned')output+='<div class="actions5">'+btn('Accept and respond','advance','data-id="'+i.id+'" data-next="responding"','btn-primary')+'</div>';if(i.status==='responding')output+='<div class="actions5">'+btn('Complete assistance','advance','data-id="'+i.id+'" data-next="confirmed"','btn-primary')+'</div>';}
 return output;
};
const swDispatchTransition=transition;
transition=function(id,next){const i=db.incidents.find(i=>i.id===id);if(!i)return;
 if(isFacility(i))return swDispatchTransition(id,next);
 if(role!=='officer'||i.assignedTo!==signedIn?.name)return notice('Only the assigned officer can update this assistance request.');
 if(!((i.status==='assigned'&&next==='responding')||(i.status==='responding'&&next==='confirmed')))return;
 i.status=next;i.history.push({at:stamp(),by:signedIn.name,event:LABELS[next]});
 if(next==='confirmed'){i.verified=false;i.latestLocation=null;}
 audit(signedIn.name,i.id+' '+LABELS[next]);save();render();
};
function swAssignOfficer(id,name){
 if(signedIn?.role!=='security')return notice('Only the control room can assign a security officer.');
 const i=db.incidents.find(i=>i.id===id);if(!i||i.type!=='security'||i.status!=='reported'||!swOfficerRoster.some(o=>o.name===name))return;
 if(swOfficerBusy(name))return notice('Selected officer is busy. Choose another officer.');
 i.status='assigned';i.assignedTo=name;i.assignedAt=stamp();i.history.push({at:stamp(),by:signedIn.name,event:'Assigned: '+name});audit(signedIn.name,i.id+' Assigned: '+name);save();swDismissControlAlert(true);render();notice('Security officer assigned.');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="sw-dispatch-officer"]');if(!b)return;const select=b.closest('section')?.querySelector('[data-officer-for]');swAssignOfficer(b.dataset.id,select?.value);});
const swDispatchNav=navItems;
navItems=function(){return role==='officer'?[['overview','My security assignments'],['incidents','My assignments']]:swDispatchNav();};
const swDispatchContent=viewContent;
viewContent=function(){if(role==='officer')return shell(hero('My security assignments','Respond to your assigned resident assistance requests and review their authorized location.')+'<section class="card card-pad">'+incidentFeed(true)+'</section>');return swDispatchContent();};
const swOfficerSeen=new Set();
setInterval(()=>{
 if(signedIn?.role!=='officer'){byId('sw-officer-alert')?.remove();return;}
 const i=db.incidents.find(i=>i.assignedTo===signedIn.name&&i.status==='assigned'&&!swOfficerSeen.has(i.id+signedIn.name));if(!i||byId('sw-officer-alert'))return;
 swOfficerSeen.add(i.id+signedIn.name);const box=document.createElement('div');box.className='modal-backdrop';box.id='sw-officer-alert';box.style.zIndex='170';box.innerHTML='<section class="modal" role="alertdialog" aria-modal="true" aria-labelledby="swOfficerTitle"><div class="modal-body"><h2 id="swOfficerTitle">New security assignment</h2><p>'+esc(i.id)+' · <span data-user-content>'+esc(i.requester||'')+'</span></p><button type="button" class="btn btn-primary" data-action="sw-officer-open">'+swTranslated('Open my assignments')+'</button></div></section>';document.body.appendChild(box);applyLanguage();box.querySelector('button').focus();
},700);
document.addEventListener('click',e=>{if(e.target.closest('[data-action="sw-officer-open"]')){byId('sw-officer-alert')?.remove();page='incidents';render();}});


// Unified control-room workflow: dispatch and field-response demo actions in one dashboard.
const swUnifiedCard=incidentCard;
incidentCard=function(i){let output=swUnifiedCard(i);if(isFacility(i)||role!=='security')return output;
 output=output.replace('The control room assigns an officer; the assigned officer accepts and resolves the request.','Assign an officer, start the response and resolve assistance here in the control room.');
 if(i.status==='assigned'||i.status==='responding')output+='<section class="card card-pad" style="margin-bottom:18px"><h3>Control-room response</h3><p>Security officer functions are included in the control room.</p><div class="actions5">'+(i.status==='assigned'?btn('Begin response','advance','data-id="'+i.id+'" data-next="responding"','btn-primary'):btn('Resolve assistance request','advance','data-id="'+i.id+'" data-next="confirmed"','btn-primary'))+'</div></section>';
 return output;
};
const swUnifiedTransition=transition;
transition=function(id,next){const i=db.incidents.find(i=>i.id===id);if(!i)return;
 if(isFacility(i))return swUnifiedTransition(id,next);
 if(signedIn?.role!=='security')return notice('This action requires the responsible dashboard.');
 if(!((i.status==='assigned'&&next==='responding')||(i.status==='responding'&&next==='confirmed')))return;
 i.status=next;i.history.push({at:stamp(),by:signedIn.name,event:LABELS[next]});if(next==='confirmed'){i.verified=false;i.latestLocation=null;}
 audit(signedIn.name,i.id+' '+LABELS[next]);save();render();
};

render();})();
</script></body></html>
